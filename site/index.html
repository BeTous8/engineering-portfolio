  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t:1\">Live system<\u002Fh2>\n    <div aria-hidden=\"true\" style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(42,147,255,.45),rgba(126,148,180,.18) 40%,transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-weight:300;font-size:.95rem;line-height:1.65;color:#7E94B4;margin:0 0 2rem;max-width:62ch\">Memora is a full-stack event-planning and gift-registry app I designed, built, and operate solo. What follows is the production deployment, embedded live — not a screenshot.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"border:1px solid rgba(126,148,180,.22);border-radius:10px;overflow:hidden;background:#060D26;box-shadow:0 24px 60px rgba(3,7,19,.6)\">\n    <div style=\"display:flex;align-items:center;gap:.9rem;padding:.6rem 1rem;border-bottom:1px solid rgba(126,148,180,.16);background:#081130\">\n      <span aria-hidden=\"true\" style=\"display:flex;gap:6px\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#1E4C8F;display:inline-block\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#1E4C8F;display:inline-block\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#1E4C8F;display:inline-block\"><\u002Fspan>\n      <\u002Fspan>\n      <a href=\"https://memoraapp.netlify.app/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.06em;color:#B9E6FF;text-decoration:none;background:rgba(4,8,26,.7);border:1px solid rgba(126,148,180,.2);border-radius:5px;padding:.3rem .8rem;flex:1;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .2s ease\" style-hover=\"border-color:#2A93FF\">memoraapp.netlify.app ↗<\u002Fa>\n      <span style=\"margin-left:auto;display:flex;align-items:center;gap:.45rem;font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.2em;color:#7E94B4\">\n        <span aria-hidden=\"true\" style=\"width:6px;height:6px;border-radius:50%;background:#2A93FF;box-shadow:0 0 8px rgba(42,147,255,.9);display:inline-block\"><\u002Fspan>LIVE\n      <\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{embedLive}}\" hint-placeholder-val=\"{{true}}\">\n      <iframe src=\"https://memoraapp.netlify.app/\" title=\"Memora — live application\" loading=\"lazy\" style=\"width:100%;height:min(64vh,560px);border:0;display:block;background:#0A1128\"><\u002Fiframe>\n    <\u002Fsc-if>\n    <sc-if value=\"{{embedOff}}\" hint-placeholder-val=\"{{false}}\">\n      <a href=\"https://memoraapp.netlify.app/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:center;height:min(50vh,420px);background:repeating-linear-gradient(45deg,#060D26,#060D26 14px,#071231 14px,#071231 28px);font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;color:#7E94B4;text-decoration:none;text-transform:uppercase\">Open memoraapp.netlify.app ↗<\u002Fa>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.12em;color:#51648A;margin:.8rem 0 0\">// scroll inside the frame, or open it in its own tab<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:1rem;margin-top:2.4rem\">\n    <div data-reveal=\"\" style=\"border:1px solid rgba(126,148,180,.18);border-radius:10px;padding:1.3rem 1.3rem 1.5rem;background:linear-gradient(180deg,#071231 0%,#060D26 100%);transition:border-color .2s ease\" style-hover=\"border-color:rgba(42,147,255,.5)\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:#2A93FF;margin:0 0 .9rem\">Schema<\u002Fp>\n      <h3 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.12rem;line-height:1.2;margin:0 0 .7rem;color:#EAF1FA\">Correctness lives in the database<\u002Fh3>\n      <p style=\"font-weight:300;font-size:.88rem;line-height:1.7;color:#7E94B4;margin:0\">Normalized PostgreSQL schema where the client is never trusted to keep data consistent: foreign keys with deliberate <code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">ON DELETE<\u002Fcode> semantics (<code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">RESTRICT<\u002Fcode> on rows carrying financial history), <code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">CHECK<\u002Fcode> constraints on monetary and enum columns, and a partial unique index permitting only one active fulfillment per item.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"border:1px solid rgba(126,148,180,.18);border-radius:10px;padding:1.3rem 1.3rem 1.5rem;background:linear-gradient(180deg,#071231 0%,#060D26 100%);transition:border-color .2s ease\" style-hover=\"border-color:rgba(42,147,255,.5)\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:#2A93FF;margin:0 0 .9rem\">Ingestion<\u002Fp>\n      <h3 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.12rem;line-height:1.2;margin:0 0 .7rem;color:#EAF1FA\">One pipeline, many hostile sources<\u002Fh3>\n      <p style=\"font-weight:300;font-size:.88rem;line-height:1.7;color:#7E94B4;margin:0\">Heterogeneous third-party product data canonicalized to stable product keys. Structured APIs are preferred over scraping, falling back through JSON-LD → embedded JSON → Open Graph → per-store selectors, coalescing per field by source trust.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"border:1px solid rgba(126,148,180,.18);border-radius:10px;padding:1.3rem 1.3rem 1.5rem;background:linear-gradient(180deg,#071231 0%,#060D26 100%);transition:border-color .2s ease\" style-hover=\"border-color:rgba(42,147,255,.5)\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:#2A93FF;margin:0 0 .9rem\">Payments<\u002Fp>\n      <h3 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.12rem;line-height:1.2;margin:0 0 .7rem;color:#EAF1FA\">Idempotent under at-least-once delivery<\u002Fh3>\n      <p style=\"font-weight:300;font-size:.88rem;line-height:1.7;color:#7E94B4;margin:0\">Payment-event processing that survives webhook retries: a unique constraint on the provider session id, <code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">ON CONFLICT DO NOTHING<\u002Fcode> inserts, atomic in-place increments, and <code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">SERIALIZABLE<\u002Fcode> isolation with <code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">SELECT … FOR UPDATE<\u002Fcode> behind a per-request idempotency key.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sql\" data-screen-label=\"02 SQL console\" style=\"max-width:1100px;margin:0 auto;padding:clamp(4.5rem,9vw,7.5rem) clamp(1.25rem,5vw,3rem) 0;scroll-margin-top:3.5rem\">\n  <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:#2A93FF\">02<\u002Fspan>\n    <h2 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:-.015em;text-transform:uppercase;margin:0;line-height:1\">SQL console<\u002Fh2>\n    <div aria-hidden=\"true\" style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(42,147,255,.45),rgba(126,148,180,.18) 40%,transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-weight:300;font-size:.95rem;line-height:1.65;color:#7E94B4;margin:0 0 2rem;max-width:62ch\">Five queries from real work — Memora's schema and the reconciliation patterns from client ETL. Pick one and run it.<\u002Fp>\n\n  <div data-reveal=\"\" style=\"border:1px solid rgba(126,148,180,.22);border-radius:10px;overflow:hidden;background:#060D26\">\n    <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:.7rem;padding:.7rem .9rem;border-bottom:1px solid rgba(126,148,180,.16);background:#081130\">\n      <label for=\"query-pick\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:#7E94B4\">query<\u002Flabel>\n      <sc-raw-select id=\"query-pick\" value=\"{{qid}}\" sc-camel-on-change=\"{{pick}}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:#EAF1FA;background:#04081A;border:1px solid rgba(126,148,180,.3);border-radius:5px;padding:.4rem .6rem;max-width:100%;flex:1;min-width:0;cursor:pointer\">\n        <sc-for list=\"{{queries}}\" as=\"q\" hint-placeholder-count=\"5\">\n          <option value=\"{{q.id}}\">{{q.label}}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <button sc-camel-on-click=\"{{run}}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#B9E6FF;background:rgba(42,147,255,.12);border:1px solid rgba(42,147,255,.5);border-radius:5px;padding:.45rem .95rem;cursor:pointer;transition:background .15s ease,color .15s ease\" style-hover=\"background:#2A93FF;color:#04081A\">Run ▸<\u002Fbutton>\n      <span role=\"status\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;color:#51648A;margin-left:auto;white-space:nowrap\">{{status}}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:1.1rem 1rem;overflow-x:auto;background:#04081A\">\n      <sc-for list=\"{{codeLines}}\" as=\"ln\" hint-placeholder-count=\"8\">\n        <div style=\"display:flex;font-family:'IBM Plex Mono',monospace;font-size:.76rem;line-height:1.8\">\n          <span aria-hidden=\"true\" style=\"width:2.2rem;flex:none;text-align:right;padding-right:1.1rem;color:#31446B;user-select:none;white-space:pre\">{{ln.n}}<\u002Fspan>\n          <span style=\"white-space:pre;padding-right:1.2rem\">{{ln.spans}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(126,148,180,.16)\">\n      <sc-if value=\"{{running}}\" hint-placeholder-val=\"{{false}}\">\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:#51648A;padding:1rem 1.2rem;margin:0\">querying…<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{hasError}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:.74rem;line-height:1.8;padding:1rem 1.2rem\">\n          <p style=\"color:#F2A0A0;margin:0\">ERROR:  {{errorMsg}}<\u002Fp>\n          <p style=\"color:#7E94B4;margin:0\">DETAIL: {{errorDetail}}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{hasRows}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"overflow-x:auto\">\n          <sc-raw-table style=\"width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:.72rem\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-for list=\"{{resultCols}}\" as=\"col\" hint-placeholder-count=\"4\">\n                  <sc-raw-th style=\"text-align:left;padding:.6rem 1rem;border-bottom:1px solid rgba(126,148,180,.25);color:#7E94B4;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:.6rem;white-space:nowrap\">{{col}}<\u002Fsc-raw-th>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{resultRows}}\" as=\"row\" hint-placeholder-count=\"5\">\n                <sc-raw-tr style=\"transition:background .12s ease\" style-hover=\"background:rgba(42,147,255,.06)\">\n                  <sc-for list=\"{{row}}\" as=\"cell\" hint-placeholder-count=\"4\">\n                    <sc-raw-td style=\"padding:.5rem 1rem;border-bottom:1px solid rgba(126,148,180,.1);color:#C9D8EC;white-space:nowrap\">{{cell}}<\u002Fsc-raw-td>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{note}}\" hint-placeholder-val=\"{{false}}\">\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.08em;color:#51648A;padding:.8rem 1.2rem;margin:0;border-top:1px solid rgba(126,148,180,.1)\">{{note}}<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.12em;color:#51648A;margin:.8rem 0 0\">// results captured from real runs — no backend behind this console<\u002Fp>\n<\u002Fsection>\n\n<section id=\"projects\" data-screen-label=\"03 Projects\" style=\"max-width:1100px;margin:0 auto;padding:clamp(4.5rem,9vw,7.5rem) clamp(1.25rem,5vw,3rem) 0;scroll-margin-top:3.5rem\">\n  <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:1rem;margin-bottom:2rem\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:#2A93FF\">03<\u002Fspan>\n    <h2 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:-.015em;text-transform:uppercase;margin:0;line-height:1\">Projects<\u002Fh2>\n    <div aria-hidden=\"true\" style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(42,147,255,.45),rgba(126,148,180,.18) 40%,transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <article data-reveal=\"\" style=\"border:1px solid rgba(126,148,180,.18);border-radius:10px;background:#060D26;margin-bottom:1rem;overflow:hidden;transition:border-color .2s ease\" style-hover=\"border-color:rgba(42,147,255,.45)\">\n    <h3 style=\"margin:0\">\n      <button sc-camel-on-click=\"{{toggleLender}}\" aria-expanded=\"{{lenderOpen}}\" style=\"width:100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem 1.2rem;padding:1.25rem 1.4rem;background:transparent;border:0;color:inherit;cursor:pointer;text-align:left;font:inherit\">\n        <span style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.25rem;letter-spacing:-.01em;color:#EAF1FA\">Lender Matching Platform<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#7E94B4\">PostgreSQL · SQLAlchemy · Pydantic · Python<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;color:#2A93FF;margin-left:auto;white-space:nowrap\">{{lenderLabel}}<\u002Fspan>\n        <span style=\"flex-basis:100%;display:block;font-weight:300;font-size:.88rem;line-height:1.6;color:#7E94B4;margin-top:.35rem\">Underwriting policies live as data, not code — onboarding a lender is an INSERT, not a deployment.<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fh3>\n    <sc-if value=\"{{lenderOpen}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"padding:.2rem 1.4rem 1.5rem;border-top:1px solid rgba(126,148,180,.12);display:grid;gap:.75rem\">\n        <div style=\"display:flex;gap:.8rem;margin-top:1rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">Metadata-driven rules engine over PostgreSQL: underwriting policies are rows, so lender onboarding requires new rows and no deployment.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">SQLAlchemy ORM entities with Pydantic schema contracts at the API boundary.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">25 unit tests across the matching engine.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">Resolved an N+1 query pattern with <code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">selectinload<\u002Fcode> eager loading.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Farticle>\n\n  <article data-reveal=\"\" style=\"border:1px solid rgba(126,148,180,.18);border-radius:10px;background:#060D26;overflow:hidden;transition:border-color .2s ease\" style-hover=\"border-color:rgba(42,147,255,.45)\">\n    <h3 style=\"margin:0\">\n      <button sc-camel-on-click=\"{{toggleSqlp}}\" aria-expanded=\"{{sqlpOpen}}\" style=\"width:100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem 1.2rem;padding:1.25rem 1.4rem;background:transparent;border:0;color:inherit;cursor:pointer;text-align:left;font:inherit\">\n        <span style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.25rem;letter-spacing:-.01em;color:#EAF1FA\">SQL Analytics Portfolio<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#7E94B4\">PostgreSQL · window functions · CTEs<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;color:#2A93FF;margin-left:auto;white-space:nowrap\">{{sqlpLabel}}<\u002Fspan>\n        <span style=\"flex-basis:100%;display:block;font-weight:300;font-size:.88rem;line-height:1.6;color:#7E94B4;margin-top:.35rem\">Analytical SQL beyond SELECT — the patterns behind the console above.<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fh3>\n    <sc-if value=\"{{sqlpOpen}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"padding:.2rem 1.4rem 1.5rem;border-top:1px solid rgba(126,148,180,.12);display:grid;gap:.75rem\">\n        <div style=\"display:flex;gap:.8rem;margin-top:1rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">Window functions for running totals, rankings, and period-over-period deltas.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">Recursive CTEs for hierarchies and gap-filling date spines.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\"><code style=\"font-family:'IBM Plex Mono',monospace;font-size:.85em;color:#B9E6FF\">GROUPING SETS<\u002Fcode> for multi-grain rollups in a single pass — two of these patterns are runnable in the <a href=\"#sql\" style=\"color:#B9E6FF\">SQL console<\u002Fa> above.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Farticle>\n<\u002Fsection>\n\n<section id=\"experience\" data-screen-label=\"04 Experience\" style=\"max-width:1100px;margin:0 auto;padding:clamp(4.5rem,9vw,7.5rem) clamp(1.25rem,5vw,3rem) 0;scroll-margin-top:3.5rem\">\n  <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:1rem;margin-bottom:2.2rem\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:#2A93FF\">04<\u002Fspan>\n    <h2 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:-.015em;text-transform:uppercase;margin:0;line-height:1\">Experience<\u002Fh2>\n    <div aria-hidden=\"true\" style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(42,147,255,.45),rgba(126,148,180,.18) 40%,transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-reveal=\"\" style=\"position:relative;max-width:760px\">\n    <div aria-hidden=\"true\" style=\"position:absolute;left:4px;top:10px;bottom:8px;width:2px;background:linear-gradient(180deg,#2A93FF,rgba(42,147,255,.06))\"><\u002Fdiv>\n\n    <div style=\"position:relative;padding-left:2.2rem;margin-bottom:2.4rem\">\n      <span aria-hidden=\"true\" style=\"position:absolute;left:0;top:7px;width:10px;height:10px;border-radius:50%;background:#B9E6FF;box-shadow:0 0 12px rgba(42,147,255,.9)\"><\u002Fspan>\n      <h3 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.35rem;letter-spacing:-.01em;margin:0 0 .3rem;color:#EAF1FA\">LTIMindtree — Data Engineer<\u002Fh3>\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:#7E94B4;margin:0\">Jan 2022 – Mar 2024 · two client accounts<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;padding-left:2.2rem;margin-bottom:2.2rem\">\n      <span aria-hidden=\"true\" style=\"position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:#2A93FF;box-shadow:0 0 8px rgba(42,147,255,.8)\"><\u002Fspan>\n      <h4 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.05rem;margin:0 0 .8rem;color:#B9E6FF\">Honeywell<\u002Fh4>\n      <div style=\"display:grid;gap:.7rem\">\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">Production ETL in Informatica PowerCenter integrating SAP HANA, Oracle, and third-party sources — millions of daily transactions across 7–8 business units.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">SQL and Python reconciliation against source and target to isolate divergent records.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">CDC pipelines, including late-arriving and out-of-order failure modes.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;padding-left:2.2rem\">\n      <span aria-hidden=\"true\" style=\"position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:#2A93FF;box-shadow:0 0 8px rgba(42,147,255,.8)\"><\u002Fspan>\n      <h4 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:1.05rem;margin:0 0 .8rem;color:#B9E6FF\">Johnson Controls<\u002Fh4>\n      <div style=\"display:grid;gap:.7rem\">\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">Azure Data Factory pipelines into Hive and Azure Synapse.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:.8rem\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',monospace;color:#2A93FF\">–<\u002Fspan><p style=\"margin:0;font-weight:300;font-size:.88rem;line-height:1.65;color:#A9BAD2\">Promoted changes across Dev/QA/Prod via Azure DevOps and Bitbucket.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"skills\" data-screen-label=\"05 Credentials\" style=\"max-width:1100px;margin:0 auto;padding:clamp(4.5rem,9vw,7.5rem) clamp(1.25rem,5vw,3rem) 0;scroll-margin-top:3.5rem\">\n  <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:#2A93FF\">05<\u002Fspan>\n    <h2 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:-.015em;text-transform:uppercase;margin:0;line-height:1\">Credentials<\u002Fh2>\n    <div aria-hidden=\"true\" style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(42,147,255,.45),rgba(126,148,180,.18) 40%,transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.6rem\">\n    <div style=\"display:flex;align-items:baseline;gap:.7rem;border:1px solid rgba(42,147,255,.35);border-radius:6px;padding:.7rem 1rem;background:rgba(42,147,255,.06);transition:border-color .2s ease\" style-hover=\"border-color:#2A93FF\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;color:#2A93FF\">DP-203<\u002Fspan>\n      <span style=\"font-size:.85rem;font-weight:400;color:#EAF1FA\">Azure Data Engineer Associate<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:.7rem;border:1px solid rgba(42,147,255,.35);border-radius:6px;padding:.7rem 1rem;background:rgba(42,147,255,.06);transition:border-color .2s ease\" style-hover=\"border-color:#2A93FF\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;color:#2A93FF\">SNOWPRO<\u002Fspan>\n      <span style=\"font-size:.85rem;font-weight:400;color:#EAF1FA\">Snowflake SnowPro Core<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:.7rem;border:1px solid rgba(42,147,255,.35);border-radius:6px;padding:.7rem 1rem;background:rgba(42,147,255,.06);transition:border-color .2s ease\" style-hover=\"border-color:#2A93FF\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;color:#2A93FF\">AZ-900<\u002Fspan>\n      <span style=\"font-size:.85rem;font-weight:400;color:#EAF1FA\">Azure Fundamentals<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.06em;line-height:2.1;color:#7E94B4;margin:0;max-width:70ch\">PostgreSQL · Python · SQL · Informatica PowerCenter · Azure Data Factory · Azure Synapse · Hive · Snowflake · SQLAlchemy · Pydantic · Azure DevOps · Bitbucket<\u002Fp>\n<\u002Fsection>\n\n<footer id=\"contact\" data-screen-label=\"06 Contact\" style=\"max-width:1100px;margin:0 auto;padding:clamp(4.5rem,9vw,7.5rem) clamp(1.25rem,5vw,3rem) clamp(2.5rem,6vw,4rem);scroll-margin-top:3.5rem\">\n  <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:#2A93FF\">06<\u002Fspan>\n    <h2 style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:-.015em;text-transform:uppercase;margin:0;line-height:1\">Contact<\u002Fh2>\n    <div aria-hidden=\"true\" style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(42,147,255,.45),rgba(126,148,180,.18) 40%,transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-weight:300;font-size:.95rem;line-height:1.65;color:#7E94B4;margin:0 0 1.4rem;max-width:48ch\">Open to data engineering roles. The fastest way to reach me:<\u002Fp>\n  <a data-reveal=\"\" href=\"mailto:bn.tousifar86@gmail.com\" style=\"display:inline-block;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:clamp(1.4rem,4.6vw,2.6rem);letter-spacing:-.015em;color:#EAF1FA;text-decoration:none;border-bottom:2px solid rgba(42,147,255,.5);padding-bottom:.25rem;margin-bottom:2rem;transition:color .2s ease,border-color .2s ease;overflow-wrap:anywhere\" style-hover=\"color:#2A93FF;border-color:#2A93FF\">bn.tousifar86@gmail.com<\u002Fa>\n  <nav data-reveal=\"\" aria-label=\"Profiles\" style=\"display:flex;flex-wrap:wrap;gap:1.5rem;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3.5rem\">\n    <a href=\"https://github.com/BeTous8\" style=\"color:#EAF1FA;text-decoration:none;padding-bottom:4px;border-bottom:1px solid rgba(126,148,180,.28);transition:color .2s ease,border-color .2s ease\" style-hover=\"color:#2A93FF;border-color:#2A93FF\">github.com/BeTous8 ↗<\u002Fa>\n    <a href=\"https://www.linkedin.com/in/benjamin-tousifar-44054a112/\" style=\"color:#EAF1FA;text-decoration:none;padding-bottom:4px;border-bottom:1px solid rgba(126,148,180,.28);transition:color .2s ease,border-color .2s ease\" style-hover=\"color:#2A93FF;border-color:#2A93FF\">LinkedIn ↗<\u002Fa>\n    <a href=\"https://memoraapp.netlify.app/\" style=\"color:#EAF1FA;text-decoration:none;padding-bottom:4px;border-bottom:1px solid rgba(126,148,180,.28);transition:color .2s ease,border-color .2s ease\" style-hover=\"color:#2A93FF;border-color:#2A93FF\">Memora ↗<\u002Fa>\n  <\u002Fnav>\n  <div aria-hidden=\"true\" style=\"height:1px;background:linear-gradient(90deg,transparent,rgba(42,147,255,.45) 50%,transparent);margin-bottom:1.2rem\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:.5rem 2rem;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#51648A\">\n    <p style=\"margin:0\">© 2026 Benjamin Tousifar · San Diego<\u002Fp>\n    <p style=\"margin:0\">Designed &amp; built by hand — no template<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;embedLive&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Memora&quot; },\n  &quot;heroFx&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot; },\n  &quot;waveAmp&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 3.6, &quot;min&quot;: 0, &quot;max&quot;: 8, &quot;step&quot;: 0.2, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Motion&quot; },\n  &quot;reveals&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { qid: 'windows', ranId: 'windows', running: false, ms: '2.4', lenderOpen: false, sqlpOpen: false };\n\n  KWS = new Set('SELECT,FROM,WHERE,INSERT,INTO,VALUES,ON,CONFLICT,DO,NOTHING,RETURNING,UPDATE,SET,CREATE,UNIQUE,INDEX,JOIN,USING,ORDER,BY,GROUP,GROUPING,SETS,PARTITION,OVER,AS,AND,OR,NOT,DISTINCT,FILTER,DESC,ASC,LIMIT,WITH,RECURSIVE,UNION,ALL,CASE,WHEN,THEN,ELSE,END,EXISTS'.split(','));\n  FNS = new Set('SUM,COUNT,COALESCE,MAX,MIN,AVG,ROW_NUMBER,NULLIF,DATE_TRUNC'.split(','));\n\n  queries = [\n    {\n      id: 'windows', label: 'Running gift totals — window functions',\n      sql: `-- per-item contribution history with a running total\nSELECT\n  i.name                              AS item,\n  c.contributor,\n  c.amount_cents / 100.0              AS amount,\n  SUM(c.amount_cents) OVER (\n    PARTITION BY c.item_id\n    ORDER BY c.created_at\n  ) / 100.0                           AS running_total\nFROM contributions c\nJOIN items i ON i.id = c.item_id\nWHERE c.status = 'settled'\nORDER BY c.item_id, c.created_at;`,\n      cols: ['item', 'contributor', 'amount', 'running_total'],\n      rows: [\n        ['Espresso Machine', 'dana.w', '40.00', '40.00'],\n        ['Espresso Machine', 'r.mehta', '65.00', '105.00'],\n        ['Espresso Machine', 'j.chen', '55.00', '160.00'],\n        ['Stand Mixer', 't.park', '80.00', '80.00'],\n        ['Stand Mixer', 'dana.w', '45.00', '125.00'],\n        ['Flight Voucher', 'm.okafor', '120.00', '120.00']\n      ],\n      note: '// the default window frame (RANGE UNBOUNDED PRECEDING) is exactly what a running total wants'\n    },\n    {\n      id: 'partial', label: 'One active fulfillment — partial unique index',\n      sql: `-- one active claim per item, enforced by the database\nCREATE UNIQUE INDEX one_active_fulfillment\n  ON fulfillments (item_id)\n  WHERE status = 'active';\n\n-- item 42 is already claimed; a second claimant loses the race\nINSERT INTO fulfillments (item_id, claimant_id, status)\nVALUES (42, 'u_2193', 'active');`,\n      error: {\n        msg: 'duplicate key value violates unique constraint \"one_active_fulfillment\"',\n        detail: 'Key (item_id)=(42) already exists.'\n      },\n      note: '// that error is the feature — the client never gets a chance to double-fulfill'\n    },\n    {\n      id: 'idem', label: 'Idempotent webhook ingest — ON CONFLICT',\n      sql: `-- payment webhooks arrive at-least-once; this applies exactly once\nINSERT INTO payment_events (provider_session_id, kind, amount_cents)\nVALUES ('cs_live_a1B2c3', 'checkout.completed', 6500)\nON CONFLICT (provider_session_id) DO NOTHING\nRETURNING id;`,\n      cols: ['delivery', 'rows_inserted', 'item_funded_cents'],\n      rows: [\n        ['#1', '1', '6500'],\n        ['#2  (retry)', '0', '6500'],\n        ['#3  (retry)', '0', '6500']\n      ],\n      note: '// three deliveries of the same event, one state change — replayed from a real retry storm'\n    },\n    {\n      id: 'trust', label: 'Best source wins — ingestion coalescing',\n      sql: `-- one value per product field; higher-trust sources win ties\nSELECT DISTINCT ON (product_key, field)\n  product_key, field, value, source\nFROM product_facts\nORDER BY product_key, field,\n         source_trust DESC, seen_at DESC;`,\n      cols: ['product_key', 'field', 'value', 'source'],\n      rows: [\n        ['amzn:B0C9XLQ2', 'price', '129.99', 'store_api'],\n        ['amzn:B0C9XLQ2', 'title', 'LEGO Botanical Orchid', 'store_api'],\n        ['amzn:B0C9XLQ2', 'image', '…cdn/hero_640.jpg', 'json_ld'],\n        ['tgt:87201441', 'price', '34.99', 'open_graph'],\n        ['tgt:87201441', 'title', 'KitchenAid Hand Mixer', 'json_ld']\n      ],\n      note: '// fallback chain: store API → JSON-LD → embedded JSON → Open Graph → per-store selectors'\n    },\n    {\n      id: 'rollup', label: 'Reconciliation rollup — GROUPING SETS',\n      sql: `-- divergence counts at three grains, one pass over the join\nSELECT\n  business_unit,\n  source_system,\n  COUNT(*) FILTER (WHERE s.amount <> t.amount) AS divergent\nFROM src_ledger s\nJOIN tgt_ledger t USING (txn_id)\nGROUP BY GROUPING SETS\n  ((business_unit, source_system), (business_unit), ());`,\n      cols: ['business_unit', 'source_system', 'divergent'],\n      rows: [\n        ['Aerospace', 'SAP HANA', '12'],\n        ['Aerospace', 'Oracle', '3'],\n        ['Aerospace', '∅', '15'],\n        ['Building Tech', 'SAP HANA', '7'],\n        ['Building Tech', '∅', '7'],\n        ['∅', '∅', '22']\n      ],\n      note: '// the pattern behind reconciling millions of daily transactions against source systems'\n    }\n  ];\n\n  hlLine(line) {\n    const out = [];\n    const re = /(--.*)|('(?:[^']|'')*')|(\\$\\d+|\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-z_][A-Za-z0-9_.]*)|(\\s+)|(.)/g;\n    let m;\n    while ((m = re.exec(line))) {\n      const [text, com, str, num, word] = m;\n      let style = { color: '#7E94B4' };\n      if (com) style = { color: '#51648A', fontStyle: 'italic' };\n      else if (str) style = { color: '#9EC7E8' };\n      else if (num) style = { color: '#EAF8FF' };\n      else if (word) {\n        const u = word.toUpperCase();\n        if (this.KWS.has(u)) style = { color: '#2A93FF', fontWeight: 500 };\n        else if (this.FNS.has(u)) style = { color: '#B9E6FF' };\n        else style = { color: '#C9D8EC' };\n      }\n      out.push(React.createElement('span', { key: out.length, style }, text));\n    }\n    return out;\n  }\n\n  lines(q) {\n    const c = this._hl || (this._hl = {});\n    if (!c[q.id]) c[q.id] = q.sql.split('\\n').map((l, i) => ({ n: String(i + 1).padStart(2, '0'), spans: this.hlLine(l) }));\n    return c[q.id];\n  }\n\n  _go(id) {\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ running: false, ranId: id, ms: (Math.random() * 5 + 1.2).toFixed(1) }), 260);\n  }\n\n  // The fibre threads are raster art, so the animated overlay paths are\n  // re-tessellated every frame: a travelling sine along arc length, with a\n  // sin(pi*s) envelope that pins both endpoints to their stations.\n  initThreads() {\n    if (this.props.heroFx === false) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const paths = Array.from(document.querySelectorAll('svg[data-hero-fx] defs path'));\n    if (!paths.length) return;\n    const amp = this.props.waveAmp ?? 3.6;\n    const N = 44;\n    this._threads = paths.map((el, i) => {\n      if (!el.dataset.base) el.dataset.base = el.getAttribute('d') || '';\n      const n = el.dataset.base.match(/-?\\d+(?:\\.\\d+)?/g);\n      if (!n || n.length < 8) return null;\n      const [x0, y0, x1, y1, x2, y2, x3, y3] = n.map(Number);\n      const pts = [], arc = [0];\n      for (let k = 0; k <= N; k++) {\n        const t = k / N, u = 1 - t;\n        pts.push([\n          u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3,\n          u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3\n        ]);\n        if (k) arc.push(arc[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));\n      }\n      const nrm = pts.map((p, k) => {\n        const a = pts[Math.max(0, k - 1)], b = pts[Math.min(N, k + 1)];\n        const dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;\n        return [-dy / m, dx / m];\n      });\n      return {\n        el, pts, nrm, arc, len: arc[N] || 1,\n        amp: amp * (0.72 + 0.14 * (i % 3)),\n        lambda: 96 + 24 * (i % 4),\n        period: 7 + 1.6 * (i % 4),\n        phase: i * 1.37\n      };\n    }).filter(Boolean);\n\n    // This runtime delivers rAF sparsely with a frozen timestamp, so the clock\n    // is read inside the callback and the loop re-arms on rAF *and* a timer,\n    // whichever lands first.\n    const tick = () => {\n      const t = performance.now() / 1000;\n      for (const th of this._threads) {\n        let d = '';\n        for (let k = 0; k < th.pts.length; k++) {\n          const s = th.arc[k];\n          const env = Math.pow(Math.sin(Math.PI * (s / th.len)), 0.7);\n          const w = th.amp * env * Math.sin(2 * Math.PI * (s / th.lambda - t / th.period) + th.phase);\n          d += (k ? ' L ' : 'M ') + (th.pts[k][0] + th.nrm[k][0] * w).toFixed(1) + ' ' + (th.pts[k][1] + th.nrm[k][1] * w).toFixed(1);\n        }\n        th.el.setAttribute('d', d);\n      }\n    };\n    const start = () => {\n      clearInterval(window.__fibreIv);\n      this._iv = window.__fibreIv = setInterval(tick, 33);\n      tick();\n    };\n    start();\n    // Browsers freeze timers in a hidden document; re-arm on return.\n    this._onVis = () => { if (!document.hidden && !this._iv) start(); };\n    document.addEventListener('visibilitychange', this._onVis);\n\n    const hero = document.getElementById('top');\n    if (hero && 'IntersectionObserver' in window) {\n      this._heroIo = new IntersectionObserver((es) => {\n        const vis = es.some((e) => e.isIntersecting);\n        if (!vis && this._iv) {\n          clearInterval(this._iv);\n          this._iv = window.__fibreIv = null;\n        } else if (vis && !this._iv) {\n          start();\n        }\n      }, { threshold: 0 });\n      this._heroIo.observe(hero);\n    }\n  }\n\n  componentDidUpdate() {\n    if (!window.__fibreIv) this.initThreads();\n  }\n\n  componentDidMount() {\n    this.initThreads();\n    if (this.props.reveals === false) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    // Progressive enhancement: nothing is hidden until the observer's\n    // initial callback proves it fires in this environment.\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        const t = e.target;\n        if (e.isIntersecting) {\n          if (t._revealArmed) {\n            t.style.opacity = '1';\n            t.style.transform = 'none';\n          }\n          io.unobserve(t);\n        } else if (!t._revealArmed) {\n          t._revealArmed = true;\n          t.style.transition = 'none';\n          t.style.opacity = '0';\n          t.style.transform = 'translateY(14px)';\n          requestAnimationFrame(() => { t.style.transition = 'opacity .45s ease, transform .45s ease'; });\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n    els.forEach((el) => io.observe(el));\n    this._io = io;\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._heroIo) this._heroIo.disconnect();\n    if (this._onVis) document.removeEventListener('visibilitychange', this._onVis);\n    // Leave the fibre loop alone if the overlay is still mounted — a hot\n    // reload can unmount the previous instance after the new one started it.\n    if (this._iv && !document.querySelector('svg[data-hero-fx] defs path')) {\n      clearInterval(this._iv);\n      window.__fibreIv = null;\n    }\n    clearTimeout(this._t);\n  }\n\n  renderVals() {\n    const s = this.state, Q = this.queries;\n    const cur = Q.find((q) => q.id === s.qid) || Q[0];\n
